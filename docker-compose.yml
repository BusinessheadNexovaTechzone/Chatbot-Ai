version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexo-chatbot:latest
    container_name: nexo-chatbot-app
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # Override localhost URLs to use Docker service names
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: nexo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: nexo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
  # qdrant_data:
